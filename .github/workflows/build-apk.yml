name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Files
        run: |
          mkdir -p www
          cp index.html www/
          if [ -d "js" ]; then cp -r js www/; fi
          if [ -d "assets" ]; then cp -r assets www/; fi
          if [ -d "css" ]; then cp -r css www/; fi

      - name: Install Dependencies
        run: npm install

      - name: Add & Sync Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK as ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Realms-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
